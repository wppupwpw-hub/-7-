<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات بوت كيلوا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f3f4f6; height: 100vh; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .msg { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1rem; font-size: 0.95rem; line-height: 1.5; position: relative; }
        .user { background: #3b82f6; color: white; align-self: flex-start; border-bottom-right-radius: 0.2rem; }
        .bot { background: white; color: #1f2937; align-self: flex-end; border-bottom-left-radius: 0.2rem; border: 1px solid #e5e7eb; shadow: sm; }
        #input-container { background: white; padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; }
        input { flex: 1; border: 1px solid #d1d5db; padding: 0.6rem 1rem; border-radius: 9999px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { background: #3b82f6; color: white; padding: 0.5rem 1.5rem; border-radius: 9999px; font-weight: 600; transition: opacity 0.2s; }
        button:disabled { opacity: 0.5; }
        .loading { display: flex; gap: 0.3rem; padding: 0.5rem; }
        .dot { width: 6px; height: 6px; background: #9ca3af; border-radius: 50%; animation: blink 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        img { max-width: 100%; border-radius: 0.5rem; margin-top: 0.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-window"></div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب رسالتك..." autocomplete="off">
        <button id="send-btn">إرسال</button>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // الرابط الخاص بك
        const BOT_URL = "http://de3.bot-hosting.net:21007/kilwa-chat";
        // بروكسي وسيط لحل مشكلة CORS في المتصفح
        const PROXY = "https://api.allorigins.win/get?url=";

        function addMessage(type, text, isHtml = false) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            if (isHtml) {
                div.innerHTML = text;
            } else {
                div.innerHTML = type === 'bot' ? marked.parse(text) : text;
            }
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div;
        }

        async function handleSend() {
            const msg = userInput.value.trim();
            if (!msg) return;

            addMessage('user', msg);
            userInput.value = '';
            
            // إضافة رسالة انتظار
            const loadingMsg = addMessage('bot', '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>', true);

            try {
                if (msg.includes("ارسم") || msg.includes("صورة")) {
                    // توليد صورة
                    const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(msg)}?width=1024&height=1024&seed=${Math.random()}`;
                    loadingMsg.innerHTML = `<img src="${imgUrl}" onclick="window.open(this.src)">`;
                } else {
                    // إرسال للدردشة عبر البروكسي لتجنب خطأ 404 و CORS
                    const target = `${BOT_URL}?text=${encodeURIComponent(msg)}`;
                    const response = await fetch(`${PROXY}${encodeURIComponent(target)}`);
                    const data = await response.json();
                    
                    // استخراج الرد من البروكسي
                    let botReply = data.contents;
                    try {
                        const jsonReply = JSON.parse(botReply);
                        botReply = jsonReply.response || jsonReply.text || jsonReply.message || botReply;
                    } catch(e) {}

                    loadingMsg.innerHTML = marked.parse(botReply || "لم أتمكن من الرد.");
                }
            } catch (error) {
                loadingMsg.innerHTML = "❌ خطأ في الاتصال بالسيرفر. يرجى التأكد من أن البوت يعمل.";
            }
        }

        sendBtn.onclick = handleSend;
        userInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };

        // رسالة ترحيبية
        window.onload = () => {
            addMessage('bot', 'أهلاً بك! أنا بوت كيلوا، كيف يمكنني مساعدتك اليوم؟');
        };
    </script>
</body>
</html>
