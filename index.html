<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات كيلوا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { max-width: 85%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.5; }
        .user-bubble { background: #0084ff; color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
        .bot-bubble { background: white; color: #1c1e21; align-self: flex-end; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        #input-area { background: white; padding: 15px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input { flex: 1; border: 1px solid #ccd0d5; padding: 10px 15px; border-radius: 20px; outline: none; }
        button { background: #0084ff; color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .loader { display: flex; gap: 4px; padding: 5px; }
        .dot { width: 6px; height: 6px; background: #90949c; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button id="send-btn">إرسال</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // رابط البوت الخاص بك ورابط الوسيط لحل مشكلة الحظر
        const BOT_URL = "http://de3.bot-hosting.net:21007/kilwa-chat";
        const PROXY_URL = "https://api.allorigins.win/get?disableCache=true&url=";

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `bubble ${sender === 'user' ? 'user-bubble' : 'bot-bubble'}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function startChat() {
            const msg = userInput.value.trim();
            if (!msg) return;

            addMessage('user', msg);
            userInput.value = '';

            const loading = document.createElement('div');
            loading.className = 'bubble bot-bubble';
            loading.innerHTML = '<div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatBox.appendChild(loading);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // الاتصال عبر الوسيط
                const finalUrl = `${PROXY_URL}${encodeURIComponent(BOT_URL + "?text=" + msg)}`;
                const response = await fetch(finalUrl);
                const data = await response.json();
                
                // تنظيف الرد (البروكسي يعيد الرد داخل contents)
                let reply = data.contents;

                // محاولة تحويله من JSON إذا كان البوت يرسل JSON كمتن نصي
                try {
                    const parsed = JSON.parse(reply);
                    reply = parsed.response || parsed.text || parsed.message || reply;
                } catch(e) {
                    // الرد نص عادي، ممتاز
                }

                loading.innerText = reply || "البوت لم يرسل رداً.";
            } catch (err) {
                loading.innerText = "❌ حدث خطأ: تأكد من أن سيرفر البوت (bot-hosting) يعمل حالياً.";
            }
        }

        sendBtn.onclick = startChat;
        userInput.onkeypress = (e) => { if (e.key === 'Enter') startChat(); };

        // رسالة ترحيب
        window.onload = () => addMessage('bot', 'مرحباً! أنا جاهز للرد على استفساراتك.');
    </script>
</body>
</html>
